# ---------------------------------------------------------------------------
# SentinelQA - framework defaults
# Every value here can be overridden by config/<env>.properties, by an OS
# environment variable (UPPER_SNAKE_CASE), or by -Dkey=value on the command line.
# ---------------------------------------------------------------------------

# ----- Browser -----
browser.name=chrome
browser.headless=true
browser.window.size=1920,1080

# ----- Selenium Grid / cloud grid -----
grid.enabled=false
grid.url=http://localhost:4444/wd/hub

# ----- Waits (seconds) -----
# Sized for a cloud SUT reached over the public internet, where a cold instance can take several
# seconds to answer. Lower it for a SUT on the same network.
timeout.explicit=20
timeout.pageload=45

# ----- API -----
api.timeout.connect=10
api.timeout.socket=30
api.sla.millis=5000
api.health.path=/ping

# ----- Retry policy -----
retry.max.attempts=2

# ----- Execution analytics store -----
db.enabled=true
db.url=jdbc:h2:./target/sentinelqa;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
db.user=sa
db.password=

# ----- Defect tracker (Jira / Azure DevOps) -----
# Auto-creation stays off until a suite is stable enough that a failure means a defect.
defect.autocreate.enabled=false
defect.base.url=https://your-org.atlassian.net
defect.project.key=QA
defect.user=
defect.api.token=

# ----- AI-assisted triage -----
ai.triage.enabled=true
ai.triage.llm.enabled=false

