name: SentinelQA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Full regression every night at 01:30 UTC (07:00 IST)
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        options: [testng-smoke.xml, testng-api.xml, testng-regression.xml]
        default: testng-smoke.xml
      environment:
        description: Target environment
        type: choice
        options: [qa, staging]
        default: qa

env:
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository

jobs:
  # ---------------------------------------------------------------- fast gate
  api-tests:
    name: API suite (${{ github.event.inputs.environment || 'qa' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run API suite
        run: >
          mvn -B clean test
          -Dsuite=testng-api.xml
          -Denv=${{ github.event.inputs.environment || 'qa' }}

      - name: Publish Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: target/allure-results
          retention-days: 14

  # ------------------------------------------------------------ browser matrix
  ui-tests:
    name: UI suite (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: api-tests
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run suite on ${{ matrix.browser }}
        run: >
          mvn -B clean test
          -Dsuite=${{ github.event.inputs.suite || (github.event_name == 'schedule' && 'testng-regression.xml' || 'testng-smoke.xml') }}
          -Dbrowser=${{ matrix.browser }}
          -Dheadless=true
          -Denv=${{ github.event.inputs.environment || 'qa' }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ matrix.browser }}
          path: target/logs
          retention-days: 7

  # ------------------------------------------------------------- Postman suite
  postman-collection:
    name: Postman collection (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install --no-save newman newman-reporter-htmlextra

      - name: Run collection
        run: >
          npx newman run postman/SentinelQA_Reservations.postman_collection.json
          -e postman/qa.postman_environment.json
          --reporters cli,junit,htmlextra
          --reporter-junit-export target/newman/junit.xml
          --reporter-htmlextra-export target/newman/report.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: target/newman

  # ------------------------------------------------------------------- report
  publish-report:
    name: Publish Allure report
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Keep report history across runs
        uses: actions/cache@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Generate report
        uses: simple-elf/allure-report-action@v1.12
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 30

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
