name: SentinelQA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Full regression every night at 01:30 UTC (07:00 IST)
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        options: [testng-smoke.xml, testng-api.xml, testng-regression.xml]
        default: testng-smoke.xml
      environment:
        description: Target environment
        type: choice
        options: [qa, staging]
        default: qa

env:
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository

jobs:
  # ---------------------------------------------------------------- fast gate
  api-tests:
    name: API suite (${{ github.event.inputs.environment || 'qa' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Run API suite
        run: >
          mvn -B clean test
          -Dsuite=testng-api.xml
          -Denv=${{ github.event.inputs.environment || 'qa' }}

      - name: Publish Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-api
          path: target/allure-results
          retention-days: 14

  # ------------------------------------------------------------ browser matrix
  ui-tests:
    name: UI suite (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: api-tests
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Run suite on ${{ matrix.browser }}
        run: >
          mvn -B clean test
          -Dsuite=${{ github.event.inputs.suite || (github.event_name == 'schedule' && 'testng-regression.xml' || 'testng-smoke.xml') }}
          -Dbrowser=${{ matrix.browser }}
          -Dheadless=true
          -Denv=${{ github.event.inputs.environment || 'qa' }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failure-logs-${{ matrix.browser }}
          path: target/logs
          retention-days: 7

  # ------------------------------------------------------------- Postman suite
  postman-collection:
    name: Postman collection (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install --no-save newman newman-reporter-htmlextra

      - name: Run collection
        run: >
          npx newman run postman/SentinelQA_Reservations.postman_collection.json
          -e postman/qa.postman_environment.json
          --reporters cli,junit,htmlextra
          --reporter-junit-export target/newman/junit.xml
          --reporter-htmlextra-export target/newman/report.html

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: newman-report
          path: target/newman

  # ------------------------------------------------------------------- report
  publish-report:
    name: Publish Allure report
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The Allure CLI is a Java program, so the report job needs the same JDK as the suite.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Collect results from every test job
        id: collect
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Restore the previous report history
        uses: actions/cache@v5
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      # Generated with the Allure CLI directly rather than a third-party action. The action that
      # was here built a Docker image on every run and broke when that image stopped building,
      # failing the job for a reason that had nothing to do with the tests. The CLI is the same
      # tool the action wrapped, with one less moving part.
      - name: Generate the report
        id: generate
        run: |
          set -euo pipefail
          if [ ! -d allure-results ] || [ -z "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "No Allure results were produced by the test jobs; nothing to publish."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Trend and history graphs only appear when the previous run's history is carried
          # into this run's results before generating.
          if [ -d allure-history/history ]; then
            cp -r allure-history/history allure-results/history
          fi
          npx --yes allure-commandline@2.29.0 generate allure-results --clean -o allure-report
          rm -rf allure-history
          mkdir -p allure-history
          cp -r allure-report/. allure-history/
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload the report
        if: steps.generate.outputs.generated == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      # Non-blocking: a repository without GitHub Pages enabled must not turn a green test run
      # red. Enable Pages (Settings -> Pages -> Deploy from branch -> gh-pages) to use it.
      - name: Publish to GitHub Pages
        if: steps.generate.outputs.generated == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
